# Tikai, self-hosted: docker compose up
# Settings come from .env (see .env.example). Open http://localhost:8080 and sign up; the first account is the admin.
name: tikai
services:
  hub:
    build:
      context: .
      dockerfile: images/hub/Dockerfile
    image: tikai/hub:local
    ports: ["${TIKAI_BIND:-127.0.0.1}:${TIKAI_PORT:-8080}:8080"]
    environment:
      ConnectionStrings__Db: Host=db;Database=tikai;Username=tikai;Password=${DB_PASSWORD:-tikai}
    volumes:
      - data:/data # Data Protection keys (later also repo mirrors); hub only
      - runs:/runs # run clones; each agent mounts only its own subdirectory (step 10)
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tikai
      POSTGRES_USER: tikai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tikai}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikai -d tikai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Lets the hub start agent containers with limited rights (step 10). Agents never see this socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment: { CONTAINERS: 1, POST: 1, IMAGES: 1, NETWORKS: 1 }
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    restart: unless-stopped

volumes:
  data:
  runs:
  pg:
